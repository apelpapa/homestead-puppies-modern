server {
    listen 80;
    listen [::]:80;
    server_name homesteadpuppies.org www.homesteadpuppies.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name homesteadpuppies.org www.homesteadpuppies.org;

    ssl_certificate     /etc/ssl/homesteadpuppies.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/homesteadpuppies.org/privkey.pem;

    root /var/www/homesteadpuppies.org/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self' https://*.paypal.com; frame-ancestors 'self'; object-src 'none'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://d3trlmj493rccc.cloudfront.net https://*.paypal.com https://*.paypalobjects.com; script-src 'self' 'sha256-/5I2Q2Zi7hx4QnCqnQMhHwr9For5wdWdXxTblaGdZCg=' 'sha256-0rwEMmIdiGe3FlIGjbdeugWHLcXVRQStDF4IQ/bIMFY=' 'sha256-4JkuZkxgHYetPJmJAdM58KX/Xg40hVhyclW6SN63biU=' 'sha256-cTnR3/JnGiWbdgAdYY+7yqEkpmUefRWfmnN0f5J8RH8=' 'sha256-duhaxWNI+6QAukUMmlYrkl97X+e0pxobkwS+TpY5/CQ=' 'sha256-eWa6DMZRMTkb7k2BX579qgK/VGeDqc4D+SQPSUKmNtE=' 'sha256-n1D9cZXw4ZNSiUR+6/8u4KC6Mx7KCFb9ScJA8U0UdhI=' 'sha256-qC7lVMeN8dhGeFDbGH8jT/rJke9zKdnRPAyZCSMN9OY=' 'sha256-RBZNiG3Ztb26Xi/69+VRecU4BPhrfxcvspLXMRrrCNE=' 'sha256-tpto3iQGydTFAyL608ZRniVQRcxuCagxRjUL7HSltFg=' 'sha256-X+PV4o5mNco/Pvq+pI48kE+2DEZFB7C85wagfp0G5Bc=' https://www.paypal.com https://www.paypalobjects.com; frame-src 'self' https://*.paypal.com; connect-src 'self' https://*.paypal.com https://*.paypalobjects.com; upgrade-insecure-requests" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /og.png {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /__spa-fallback.html;
    }
}
