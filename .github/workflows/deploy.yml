name: Deploy React frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homestead-react-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test deployment safeguards
        run: python3 -m unittest discover -s ops/deploy -p 'test_*.py' -v
      - name: Check and build
        run: |
          pnpm typecheck
          pnpm build
          pnpm csp:update
          pnpm csp:verify
      - name: Publish release
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DROPLET_HOST:?Missing DROPLET_HOST}"
          : "${DROPLET_USER:?Missing DROPLET_USER}"
          : "${DROPLET_SSH_KEY:?Missing DROPLET_SSH_KEY}"
          : "${DROPLET_KNOWN_HOSTS:?Missing DROPLET_KNOWN_HOSTS}"
          ssh_directory="$RUNNER_TEMP/homestead-react-ssh"
          mkdir -m 700 "$ssh_directory"
          trap 'rm -f "$ssh_directory/key"' EXIT
          printf '%s\n' "$DROPLET_SSH_KEY" > "$ssh_directory/key"
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          chmod 600 "$ssh_directory/key" "$ssh_directory/known_hosts"
          tar --exclude="./.vite" -czf "$RUNNER_TEMP/homestead-react.tar.gz" -C build/client .
          ssh -i "$ssh_directory/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_directory/known_hosts" \
            "$DROPLET_USER@$DROPLET_HOST" "deploy-react $GITHUB_SHA" \
            < "$RUNNER_TEMP/homestead-react.tar.gz"
