server {
    listen 80;
    listen [::]:80;
    server_name homesteadpuppies.org www.homesteadpuppies.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name homesteadpuppies.org www.homesteadpuppies.org;
    access_log /var/log/nginx/homesteadpuppies.org.access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/homesteadpuppies.org.error.log warn;

    ssl_certificate     /etc/ssl/homesteadpuppies.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/homesteadpuppies.org/privkey.pem;

    root /var/www/homesteadpuppies.org/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self' https://*.paypal.com; frame-ancestors 'self'; object-src 'none'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://d3trlmj493rccc.cloudfront.net https://*.paypal.com https://*.paypalobjects.com; script-src 'self' https://www.paypal.com https://www.paypalobjects.com 'sha256-4bR3bbVRP0oPqnwGKapcfpiD8OI5Rttir4pvAEVzRdA=' 'sha256-A9seJb8SpCkMn/yv0l8k3RdZrLytr8CL5ewD98R/iz8=' 'sha256-RBZNiG3Ztb26Xi/69+VRecU4BPhrfxcvspLXMRrrCNE=' 'sha256-X+PV4o5mNco/Pvq+pI48kE+2DEZFB7C85wagfp0G5Bc=' 'sha256-duhaxWNI+6QAukUMmlYrkl97X+e0pxobkwS+TpY5/CQ=' 'sha256-eFgAyA3EtLZ6tPpysj2loTTmTZl+Y+FacJ5Rko3Qgs8=' 'sha256-eWa6DMZRMTkb7k2BX579qgK/VGeDqc4D+SQPSUKmNtE=' 'sha256-g98r7uAMqeMXtWrHJzPwQBnc0zztPWdlMcBHwSa7e24=' 'sha256-gpWTRKLanQiwLls6KCzSQUPq1QQN2PWtCFlp6iKyBeg=' 'sha256-n1D9cZXw4ZNSiUR+6/8u4KC6Mx7KCFb9ScJA8U0UdhI=' 'sha256-zK3axQfRfzIA8cveBlk8Vdo7KSZ+xspt8D8W47lGmfc='; frame-src 'self' https://*.paypal.com; connect-src 'self' https://*.paypal.com https://*.paypalobjects.com; upgrade-insecure-requests" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /og.png {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /__spa-fallback.html;
    }
}
